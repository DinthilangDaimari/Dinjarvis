name: Build Web App to APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Web Assets Directory
        run: |
          mkdir -p www
          # Search for any HTML file in the repository and copy it as index.html
          HTML_FILE=$(find . -maxdepth 3 -name "*.html" ! -path "./www/*" ! -path "./.github/*" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" www/index.html
          else
            echo "<html><body><h1>JARVIS UI Not Found</h1></body></html>" > www/index.html
          fi

      - name: Build Android Package via Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
          npx cap init "J.A.R.V.I.S." "com.stark.jarvis" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
