name: Build Native Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Compile Native Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy Built APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/JARVIS-AI.apk
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS-AI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Native-Android-APK
          path: dist/JARVIS-AI.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "J.A.R.V.I.S. Native Android App v1.0.0"
          body: |
            ### 🤖 J.A.R.V.I.S. Native Android Application (APK)
            Download and install the native Android APK package below:
            - **File**: `JARVIS-AI.apk`
            - **Platform**: Native Android (Kotlin + Jetpack Compose)
            - **Features**: Real Arc Reactor Voice Engine, SpeechRecognizer, Gemini 3.5 Flash, TextToSpeech, Floating Overlay across apps, Smart Home, Calendar, Phone Dialer.
          files: dist/JARVIS-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

